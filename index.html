<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-title" content="Mozzi">
<title>Mozzi</title>
<style>
/* ============================================================
   Mozzi · foglio di stile
   Foglio di stile completo dell'app (unico blocco di stile del file).
   Nero, un solo accento, righe sottili, testi fini.
   Non richiede modifiche a HTML o JavaScript.
   ============================================================ */

/* ---------- token ---------- */
:root{
  --bg:#000;--card:#0f1312;--ink:#f2f6f5;--mut:#8d9a97;--line:#222927;
  --acc:#4fc3b8;--accink:#06201e;--err:#ff6b60;--ok:#3ddc8a;--c2:#f5a524;
  --acc-soft:color-mix(in srgb,var(--acc) 12%,transparent);
  --ink-soft:color-mix(in srgb,var(--ink) 8%,transparent);
  --font:-apple-system,BlinkMacSystemFont,system-ui,"Helvetica Neue",Arial,sans-serif;
  --r-m:14px;--r-l:22px;--r-pill:999px;
  --tap:44px;
  --t-fast:120ms;--t-base:180ms;--t-sheet:220ms;--ease:cubic-bezier(.2,.7,.2,1);
}

/* ---------- base ---------- */
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%}
html{color-scheme:dark;-webkit-text-size-adjust:100%}
body{background:var(--bg);color:var(--ink);font:300 16px/1.5 var(--font);padding:env(safe-area-inset-top) 16px env(safe-area-inset-bottom);-webkit-font-smoothing:antialiased}
main{max-width:420px;margin:0 auto;padding:16px 0 64px}
button{font:inherit;color:inherit;touch-action:manipulation}
h1,h2{font-family:var(--font);font-weight:400;letter-spacing:-.01em;margin:0}
h1{font-size:2rem;line-height:1.15;margin:0 0 6px}
.sub{color:var(--mut);margin:0 0 24px}
b,strong{font-weight:500}
.mini{font-size:.875rem;line-height:1.45;color:var(--mut);font-weight:300;overflow-wrap:anywhere}
.mini b{color:var(--ink);font-weight:400}
.up,.mini .up{color:var(--ok)}
.dn,.mini .dn{color:var(--err)}
.who{font-weight:400;word-break:break-all}
.net{display:inline-block;font-size:.8125rem;color:var(--mut);margin-top:18px}
[hidden]{display:none!important}
body.lock{overflow:hidden}

/* ---------- focus ---------- */
:focus{outline:0}
:focus-visible{outline:2px solid var(--acc);outline-offset:3px}
input:focus-visible,select:focus-visible{outline:0}

/* ---------- campi ---------- */
label{display:block;font-size:.8125rem;color:var(--mut);font-weight:400;margin:0 0 2px}
input,select{display:block;width:100%;min-height:var(--tap);font:inherit;font-weight:400;color:var(--ink);background:transparent;border:0;border-bottom:1px solid var(--line);border-radius:0;padding:10px 0 12px;margin:0 0 16px;-webkit-appearance:none;appearance:none;transition:border-color var(--t-base),box-shadow var(--t-base)}
input::placeholder{color:var(--mut);opacity:.6}
input:focus,select:focus{border-bottom-color:var(--acc);box-shadow:0 1px 0 var(--acc)}
input:disabled,select:disabled{opacity:.45}
select{padding-right:26px;background-image:url("data:image/svg+xml;charset=utf-8,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%238d9a97' stroke-width='1.6' stroke-linecap='round' stroke-linejoin='round'%3E%3Cpath d='M6 9l6 6 6-6'/%3E%3C/svg%3E");background-repeat:no-repeat;background-position:right 2px center;background-size:16px}
select option{background:var(--card);color:var(--ink)}
input[type=date]{text-align:left}
input[type=date]::-webkit-date-and-time-value{text-align:left}
input[type=checkbox]{display:inline-block;width:20px;height:20px;min-height:0;margin:0;padding:0;border:0;-webkit-appearance:auto;appearance:auto;accent-color:var(--acc);flex:none}
input[type=color]{width:40px;height:40px;min-height:0;padding:0;margin:0;border:1px solid var(--line);border-radius:50%;flex:none;overflow:hidden}
input[type=color]::-webkit-color-swatch-wrapper{padding:0}
input[type=color]::-webkit-color-swatch{border:0;border-radius:50%}
.chk{display:flex;align-items:center;gap:12px;margin:4px 0 16px;font-size:.9375rem;font-weight:300;color:var(--ink);min-height:var(--tap)}
.chk input{width:20px;margin:0}
.row{display:flex;gap:10px;align-items:stretch}
.row>div{min-width:0}
.row input,.row select{margin:0}
.row .go,.row .ghost{width:auto}

/* ---------- pulsanti ---------- */
.go,.ghost{display:inline-block;width:100%;min-height:var(--tap);padding:12px 18px;border-radius:var(--r-pill);border:1px solid var(--acc);background:transparent;color:var(--acc);font:inherit;font-weight:500;line-height:1.25;text-align:center;cursor:pointer;transition:background-color var(--t-base) var(--ease),border-color var(--t-base),color var(--t-base),opacity var(--t-fast),transform var(--t-fast)}
.ghost{width:auto;border-color:var(--line);color:var(--ink);font-weight:400}
.go:active{background:var(--acc-soft);transform:scale(.98)}
.ghost:active{background:var(--ink-soft);transform:scale(.98)}
.go:disabled,.ghost:disabled{opacity:.4;pointer-events:none}
.gtbl .ghost,.hrow .ghost,.mini .ghost{min-height:32px;padding:4px 10px;font-size:.875rem}
.lnk{background:none;border:0;color:var(--acc);font:inherit;text-decoration:underline;text-underline-offset:3px;cursor:pointer;padding:0}
.flag{font-size:1.5rem;line-height:1}
.go.flag,.ghost.flag{min-width:var(--tap);padding:6px 10px}

/* ---------- barra in alto e intestazioni ---------- */
.logo{display:flex;justify-content:center;margin:4px 0 12px}
.logo svg{width:40px;height:40px;display:block}
#bar{position:sticky;top:0;z-index:5;display:flex;justify-content:space-between;align-items:center;gap:8px;min-height:52px;margin:0 -16px 6px;padding:4px 16px;background:var(--bg)}
#bar>.mini{position:absolute;left:50%;transform:translateX(-50%);max-width:56%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:.875rem;color:var(--mut)}
.mbtn{border:0;background:none;padding:10px 0;min-height:var(--tap);font-weight:500;color:var(--ink);cursor:pointer;transition:color var(--t-base),opacity var(--t-fast)}
.mbtn:active{opacity:.6}
.bulb{flex:none;width:var(--tap);height:var(--tap);display:flex;align-items:center;justify-content:center;border:0;border-radius:var(--r-pill);background:none;color:var(--mut);padding:0;cursor:pointer;transition:color var(--t-base),transform var(--t-fast)}
.bulb:active{color:var(--acc);transform:scale(.94)}
.ico{width:22px;height:22px;display:block}
.top{display:flex;justify-content:space-between;align-items:center;gap:8px;min-height:var(--tap);margin:0 0 4px}
.top .ghost{border:0;padding:10px 0;color:var(--mut);font-weight:400;background:none;min-width:0}
.top .ghost:active{color:var(--ink);transform:none;background:none}
.top .yr,.top .mini{font-size:.9375rem;color:var(--mut);font-weight:400}
.mb{display:flex;align-items:center;justify-content:space-between;margin:4px 0 8px}
.mb button{width:var(--tap);height:var(--tap);border:0;background:none;color:var(--ink);border-radius:var(--r-pill);font-size:1.5rem;line-height:1;cursor:pointer;transition:opacity var(--t-fast),transform var(--t-fast)}
.mb button:active{transform:scale(.9)}
.mb button:disabled{opacity:.25}
.mb span{font-weight:400}
.gt{font-size:.9375rem;font-weight:400;color:var(--mut);margin:28px 0 6px;letter-spacing:0;border:0;padding:0}
/* ogni sezione ha il suo colore: verde acqua per il patrimonio, ambra per le spese, verde per le entrate, azzurro per il risparmio, rosa per gli obiettivi, oro per la hall of fame */
body[data-sec="spese"]{--acc:#f5a524;--accink:#1a1200}body[data-sec="entrate"]{--acc:#3ddc8a;--accink:#06201e}body[data-sec="risparmio"]{--acc:#5b8def;--accink:#fff}
body[data-sec="obiettivi"]{--acc:#ec6aa6;--accink:#fff}body[data-sec="hof"]{--acc:#e0b45a;--accink:#1a1200}body[data-sec="sistema"]{--acc:#9bb0ab;--accink:#0a0d0c}
.mi[data-a="home"],.mi[data-a="sub"],.mi[data-a="esub"],.mi[data-a="isub"],.mi[data-a="sav"],.mi[data-a="hist"],.mi[data-a="goals"],.mi[data-a="hof"]{position:relative;padding-left:26px}
.mi[data-a="home"]::before,.mi[data-a="sub"]::before,.mi[data-a="esub"]::before,.mi[data-a="isub"]::before,.mi[data-a="sav"]::before,.mi[data-a="hist"]::before,.mi[data-a="goals"]::before,.mi[data-a="hof"]::before{content:"";position:absolute;left:8px;top:50%;width:8px;height:8px;margin-top:-4px;border-radius:50%;background:#4fc3b8}
.mi[data-a="esub"]::before{background:#f5a524}.mi[data-a="isub"]::before{background:#3ddc8a}.mi[data-a="sav"]::before{background:#5b8def}.mi[data-a="goals"]::before{background:#ec6aa6}.mi[data-a="hof"]::before{background:#e0b45a}
h1+p.mini,.gt+p.mini{display:none}   /* le spiegazioni lunghe vivono nella lampadina */
.pxs{text-align:center;margin:10px 0}

/* ---------- numeri grandi e variazioni ---------- */
.big{font-size:2.6rem;line-height:1.1;font-weight:300;letter-spacing:-.03em;margin:4px 0;font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.pill{display:inline-block;font-size:.8125rem;font-weight:500;font-style:normal;line-height:1.3;padding:0;margin-left:8px;vertical-align:middle;white-space:nowrap;font-variant-numeric:tabular-nums}
.pill.up{color:var(--ok)}
.pill.dn{color:var(--err)}
.pill.fl{color:var(--mut)}
.big .pill{font-size:1rem;margin-left:10px;letter-spacing:0}
.r{display:flex;flex-direction:column;align-items:flex-end;gap:2px}
.r .pill{margin:0}
.chg{display:inline-flex;flex-wrap:wrap;align-items:baseline;gap:2px 10px;margin-top:4px}
.chg .pill,.fx .pill{margin:0}
.chg .pill+small{margin-left:-6px}
.chg small,.fx small{color:var(--mut);font-size:.8125rem;font-weight:300}
.fx{margin:10px 0 0;padding:4px 0;cursor:pointer}

/* ---------- sezioni e riquadri ---------- */
.card{background:transparent;border:0;border-bottom:1px solid var(--line);border-radius:0;padding:20px 0}
.card.ug{padding:0}
.card.note{background:var(--card);border:1px solid var(--line);border-radius:var(--r-m);padding:18px 18px 16px;margin:8px 0 18px}
.card.note b{display:block;font-size:1rem;font-weight:500;margin-bottom:2px}
.card.note .row{margin-top:6px}
.warn{border:1px solid var(--err);color:var(--err);border-radius:var(--r-m);padding:12px 14px;margin-bottom:16px;font-size:.875rem}
#msg{min-height:1.4em;margin:14px 0 0;font-size:.875rem;color:var(--mut)}
#msg.err{color:var(--err)}
#msg.ok{color:var(--ok)}

/* ---------- liste e righe ---------- */
.cats,.list{display:grid;gap:0;margin:4px 0 20px}
.catbtn,.item{display:flex;justify-content:space-between;align-items:center;gap:12px;width:100%;min-height:60px;padding:16px 0;text-align:left;font:inherit;font-weight:300;color:var(--ink);background:none;border:0;border-bottom:1px solid var(--line);border-radius:0;cursor:pointer;transition:opacity var(--t-fast)}
.catbtn:active,.item:active{opacity:.55}
.catbtn b,.item b{font-weight:400;font-variant-numeric:tabular-nums;white-space:nowrap}
.item{align-items:flex-start}
.item small{display:block;color:var(--mut);font-size:.8125rem;font-weight:300;margin-top:2px}
.hrow,.urow,.rrow{font-weight:300}
.hrow{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:12px 0;min-height:var(--tap);font-variant-numeric:tabular-nums}
.hrow+.hrow{border-top:1px solid var(--line)}
.hrow b{font-weight:400}
.hrow .pill{margin-left:8px}
.urow{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:6px 0;margin:0;font-size:1rem;color:var(--ink)}
.urow+.urow{border-top:1px solid var(--line)}
.urow input{width:42%;margin:0;text-align:right;padding:8px 0;border-bottom-color:transparent}
.urow small{display:block;color:var(--mut);font-size:.8125rem;font-weight:300}
.urow b{font-weight:400}
.rrow{padding:14px 0}
.rrow+.rrow{border-top:1px solid var(--line)}
.rh{display:flex;justify-content:space-between;align-items:baseline;gap:8px;margin-bottom:4px}
.rh b{font-weight:400;font-variant-numeric:tabular-nums}
.res{flex:1;text-align:right;align-self:center;font-weight:500}
.res.s{color:var(--err)}
.res.b{color:var(--ok)}
.res.m{color:var(--mut);font-weight:300}
.res small{display:block;font-weight:300;color:var(--mut);font-size:.8125rem}
.arow{display:grid;grid-template-columns:1.6fr 1fr 1fr 1fr auto;gap:6px;align-items:center;padding:6px 0}
.arow+.arow{border-top:1px solid var(--line)}
.arow input{margin:0;padding:8px 0;min-width:0;min-height:40px}
.arow input:not(:first-child){text-align:right}
.arow.ah span{font-size:.75rem;color:var(--mut)}
.vrow{display:grid;grid-template-columns:1.1fr 1fr 1.1fr auto;gap:8px;align-items:center;padding:8px 0}
.vrow+.vrow{border-top:1px solid var(--line)}
.vrow input,.vrow select{margin:0;padding:8px 0;min-width:0;min-height:40px}
.vrow small{grid-column:1/-1;color:var(--mut);font-size:.8125rem}
.bar{height:4px;background:var(--line);border-radius:var(--r-pill);overflow:hidden;margin-top:8px}
.bar i{display:block;height:100%;background:var(--acc);border-radius:var(--r-pill)}

/* ---------- selezioni: chip, EUR/USD, schede ---------- */
.cur{display:flex;gap:8px;margin-top:16px}
.cur button,.chip{position:relative;border:1px solid var(--line);background:none;color:var(--mut);border-radius:var(--r-pill);padding:7px 14px;min-height:34px;font:inherit;font-size:.8125rem;font-weight:400;cursor:pointer;transition:color var(--t-base),border-color var(--t-base),background-color var(--t-base),transform var(--t-fast)}
.cur button::after,.chip::after{content:"";position:absolute;inset:-5px}   /* area di tocco da 44 px */
.cur button[aria-pressed=true],.chip[aria-pressed=true]{color:var(--acc);border-color:var(--acc);background:var(--acc-soft)}
.cur button:active,.chip:active{transform:scale(.96)}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0 16px}
.chip{font-size:.875rem;padding:8px 14px;min-height:36px}
.tabs{display:flex;border-bottom:1px solid var(--line);margin-bottom:20px}
.tabs button{flex:1;border:0;background:none;color:var(--mut);font:inherit;font-weight:400;padding:12px 8px;min-height:var(--tap);cursor:pointer;box-shadow:inset 0 -2px 0 transparent;transition:color var(--t-base),box-shadow var(--t-base)}
.tabs button[aria-selected=true]{color:var(--ink);font-weight:500;box-shadow:inset 0 -2px 0 var(--acc)}

/* ---------- tabelle ---------- */
.tbl{width:100%;border-collapse:collapse;font-size:.8125rem;font-weight:300;font-variant-numeric:tabular-nums}
.tbl th,.tbl td{padding:10px 3px;text-align:right;border-top:1px solid var(--line);white-space:nowrap}
.tbl th{color:var(--mut);font-weight:400;border-top:0;padding-top:4px}
.tbl th:first-child,.tbl td:first-child{text-align:left;white-space:normal;padding-left:0;position:sticky;left:0;background:var(--bg);padding-right:8px}   /* la prima colonna resta ferma quando la tabella scorre */
.tbl th:last-child,.tbl td:last-child{padding-right:0}
.tbl b{font-weight:500}
.gtbl{border-collapse:collapse;width:100%}
.gtbl th{font-weight:400;color:var(--mut);font-size:.75rem;padding:6px 1px}
.gtbl td{padding:4px 1px;text-align:center}
.gtbl td:first-child{text-align:left;font-size:.8125rem;line-height:1.25;font-weight:300;padding:4px 8px 4px 0;max-width:86px;overflow-wrap:anywhere}
.gb{display:block;margin:0 auto;width:18px;height:18px;border-radius:5px;border:1px solid var(--line);background:transparent;cursor:pointer;padding:0;transition:background-color var(--t-base),border-color var(--t-base),transform var(--t-fast)}
.gb:active{transform:scale(.9)}
.gb.g{background:var(--ok);border-color:var(--ok)}
.gb.y{background:var(--c2);border-color:var(--c2)}
.gb.r{background:var(--err);border-color:var(--err)}
.dot{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:10px;vertical-align:-1px}
.lg{transition:opacity var(--t-base)}
.lg.off{opacity:.4}
.lg.off .dot{background:var(--line)!important}

/* ---------- grafici ---------- */
.chart{display:block;width:100%;height:auto;margin:8px 0 10px}
.ln{fill:none;stroke-width:2;stroke-linejoin:round;stroke-linecap:round}
.ln1,.c1{stroke:var(--acc);color:var(--acc)}
.ln2,.c2{stroke:var(--c2);color:var(--c2)}
.ln1d{fill:var(--acc)}
.ln2d{fill:var(--c2)}
.grid{stroke:var(--line);stroke-width:1}
.ax{fill:var(--mut);font:400 10px var(--font)}
.ax[font-weight]{fill:var(--ink);font-weight:500}
.spark{display:block;width:100%;text-align:left;font:inherit;color:var(--ink);background:none;border:0;border-bottom:1px solid var(--line);padding:12px 0;margin-top:10px;cursor:pointer}
.spark svg{display:block;width:100%;height:56px;margin-top:8px}

/* ---------- scelta dell'anno ---------- */
.pick h2{font-size:1.5rem;line-height:1.2;text-align:center;margin:8px 0 24px}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.tile{aspect-ratio:1;border:0;border-radius:18px;color:#fff;font:400 2rem/1 var(--font);letter-spacing:-.02em;display:flex;align-items:flex-end;padding:16px;text-align:left;cursor:pointer;transition:transform var(--t-fast),filter var(--t-base)}
.tile:active{transform:scale(.97)}
.t0{background:#0f6b6b}.t1{background:#1d5c96}.t2{background:#b26a16}.t3{background:#6e3b7a}
.tile.add{background:none;border:1px dashed var(--line);color:var(--mut);font:400 1rem/1.3 var(--font);align-items:center;justify-content:center;text-align:center}
.addform{margin-top:18px}

/* ---------- menu a schermo intero ---------- */
.panel{position:fixed;inset:0;z-index:10;background:var(--bg);overflow:auto;overscroll-behavior:contain;padding:env(safe-area-inset-top,0px) 16px calc(24px + env(safe-area-inset-bottom,0px))}
.panel .wrap{max-width:420px;margin:0 auto;animation:in var(--t-base) var(--ease)}
.ph{display:flex;justify-content:space-between;align-items:center;gap:8px;min-height:52px;padding:4px 0;margin-bottom:10px}
.ph .mini{font-size:.875rem}
.mi{display:flex;justify-content:space-between;align-items:center;gap:12px;width:100%;min-height:58px;padding:16px 0;text-align:left;font:inherit;font-size:1.125rem;font-weight:300;color:var(--ink);background:none;border:0;border-bottom:1px solid var(--line);border-radius:0;cursor:pointer;transition:opacity var(--t-fast),color var(--t-base)}
.mi:active{opacity:.55}
.mi>span:last-child{color:var(--mut);font-weight:300;font-size:1rem}
.mi[aria-expanded=true]{font-weight:400}
.mi.sm{font-size:1rem;min-height:50px;padding:13px 0 13px 18px;box-shadow:inset 1px 0 0 var(--line)}
.mi.sm>span:last-child{font-size:.875rem}
.mi.on{color:var(--acc);font-weight:500}

/* ---------- fogli: lampadina, benvenuto, finestre ---------- */
.ov{position:fixed;inset:0;z-index:50;display:flex;align-items:flex-end;justify-content:center;padding:0;background:rgba(0,0,0,.72);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);animation:fade .15s ease-out}
.ov .card{width:100%;max-width:480px;max-height:88vh;max-height:88dvh;overflow:auto;background:var(--card);border:1px solid var(--line);border-bottom:0;border-radius:var(--r-l) var(--r-l) 0 0;padding:18px 20px calc(24px + env(safe-area-inset-bottom,0px));animation:sheet var(--t-sheet) var(--ease)}
.ov.help .card{max-width:480px}
.ov:has(input):not(.help){align-items:center;padding:16px}          /* con la tastiera aperta la finestra resta visibile */
.ov:has(input):not(.help) .card{border-bottom:1px solid var(--line);border-radius:var(--r-l);padding-bottom:20px}
.ov .row .go{flex:1}
.help h3{margin:18px 0 4px;font-size:1rem;font-weight:500}
.help p{margin:0 0 6px;line-height:1.5;font-weight:300}

/* ---------- movimento: breve, solo in risposta a un'azione ---------- */
@keyframes in{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes sheet{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}
main>section:not([hidden]){animation:in var(--t-base) var(--ease)}
@media (hover:hover){
  .go:hover{background:var(--acc-soft)}
  .ghost:hover{border-color:var(--mut)}
  .top .ghost:hover,.mbtn:hover,.bulb:hover{color:var(--acc);border-color:transparent}
  .catbtn:hover,.item:hover,.mi:hover{opacity:.75}
  .chip:hover,.cur button:hover{border-color:var(--mut);color:var(--ink)}
  .tile:hover{filter:brightness(1.08)}
  .lnk:hover{color:var(--ink)}
}

const ckYears=()=>"years:"+uid, ckLast=()=>"lastYear:"+uid, kd=y=>`data:${uid}:${y}`, kdirty=()=>"dirty:"+uid;

async function loadYears(){
  const cached=LS.get(ckYears(),[]);
  if(D||!navigator.onLine){ if(D&&!cached.length){const y=new Date().getFullYear();LS.set(ckYears(),[y]);return [y];} return cached; }
  const {data,error}=await db.from("years").select("year").order("year",{ascending:false});
  if(error){ if(cached.length) return cached; throw error; }
  let list=data.map(r=>r.year);
  if(!list.length){const y=new Date().getFullYear();const {error:e2}=await db.from("years").insert({year:y});if(e2)throw e2;list=[y];}
  LS.set(ckYears(),list);return list;
}
async function pull(y){
  let local=LS.get(kd(y),null);
  if(D||!navigator.onLine||LS.get(kdirty(),[]).includes(y)) return local||{items:[]};
  try{const {data,error}=await db.from("year_data").select("data").eq("year",y).maybeSingle();
    if(!error&&data){local=data.data;LS.set(kd(y),local);}}catch{}
  return local||{items:[]};
}
async function push(){
  if(D||!navigator.onLine||!uid){net();return;}
  for(const y of LS.get(kdirty(),[])){
    const {error}=await db.from("year_data").upsert({year:y,data:LS.get(kd(y))},{onConflict:"user_id,year"});
    if(!error) LS.set(kdirty(),LS.get(kdirty(),[]).filter(x=>x!==y));
  }
  if(LS.get(kcdirty(),0)){const {error}=await db.from("user_settings").upsert({user_id:uid,data:CFG},{onConflict:"user_id"});if(!error)LS.set(kcdirty(),0);}
  net();
}
function save(){LS.set(kd(S.y),S.data);const d=LS.get(kdirty(),[]);if(!d.includes(S.y))LS.set(kdirty(),[...d,S.y]);net();push();}

const lastV=(it,m)=>{for(let k=m;k>=1;k--)if(it.v[k]!==undefined)return it.v[k];return 0;};
async function carryOver(y){                                      // riporto dall'anno prima: stesse voci, dicembre come partenza di gennaio, budget, obiettivi senza spunte
  const prev=years.filter(x=>x<y).sort((a,b)=>b-a)[0];if(!prev)return false;
  const p=await pull(prev);if(!p||!(p.items||[]).length)return false;
  S.data.items=p.items.map(i=>{const v=lastV(i,12),n={...i,v:{}};if(v)n.v[1]=v;return n;});
  if(p.budget)S.data.budget={...p.budget};
  if(p.goals)S.data.goals=p.goals.map(g=>({...g,st:{}}));
  if(p.reb)S.data.reb=JSON.parse(JSON.stringify(p.reb));
  S.data.carried=prev;save();return true;
}
async function openYear(y){
  localStorage.setItem(ckLast(),y);S.y=y;
  const now=new Date();S.m=y===now.getFullYear()?now.getMonth()+1:12;
  S.data=await pull(y);S.data.items=S.data.items||[];
  if(!S.data.items.length&&!S.data.carried)await carryOver(y);
  if(D&&!S.data.items.length&&y===NY&&!LS.get("noseed:"+uid,0))seed(); else if(snap())save();
  seedExp();applyRec();autoClose();
  refresh(true);
  renderHome();screen("home");showWelcome();
}

function updateReb(){
  const R=S.data.reb,cs=FIN(),T=cs.reduce((a,[id])=>a+tot(S.m,id),0),X=taxX(),rate=R.mode==="acq"?0:taxRate(),acq=R.mode==="acq";
  const A=acq?(parseNum($("racq").value)||0):0,tol=acq?0:(parseNum($("rtol").value)||0);
  let sum=0,net=0,taxT=0,need=0;const rows=cs.map(([id])=>{const c=tot(S.m,id),x=parseNum(document.querySelector(`[data-r=${id}]`).value);
    const r={id,c,x:x!==null&&isFinite(x)?x:null};r.pc=r.x??(T?c/T*100:0);r.nd=acq?Math.max(0,r.pc/100*(T+A)-c):0;need+=r.nd;return r;});
  const byTitle=(r,d)=>{const tt=$("tt-"+r.id);if(!tt)return;const its=S.data.items.filter(i=>i.cat===r.id&&val(i,S.m)>0);
    if(Math.abs(d)<0.5||its.length<2||r.c<=0){tt.innerHTML="";return;}                                        // ripartizione proporzionale al peso di ogni titolo
    tt.innerHTML=`<div class="mini" style="margin:6px 0 0">${L("Per titolo, in proporzione al peso:","By security, in proportion to weight:")}</div>`+its.map(i=>{const w=cv(val(i,S.m),i.cur,S.m)/r.c,x=Math.abs(d)*w,px=i.qty&&(i.tk||i.up)?cv(i.tk?pr(i.tk):i.up,i.cur,S.m):0;
      return `<div class="hrow" style="padding:4px 0"><span class="mini">${esc(i.name)}</span><span class="mini"><b class="${d<0?"dn":"up"}">${d<0?L("vendi","sell"):L("compra","buy")} ${fmt(x)}</b>${px>0?` <small>≈ ${(x/px).toLocaleString("it-IT",{maximumFractionDigits:2})} ${L("quote","units")}</small>`:""}</span></div>`;}).join("");};
  rows.forEach(r=>{
    const el=$("res-"+r.id);let d;
    if(acq){sum+=r.pc;d=need>0&&A>0?r.nd*A/need:0;}
    else{let t;if(R.mode==="pct"){sum+=r.pc;t=r.pc/100*T;}else{t=r.x??r.c;sum+=t;}d=t-r.c;
      if(tol&&Math.abs(d)>=0.5&&Math.abs(d)/(T||1)*100<tol){el.className="res m";el.textContent="Entro la tolleranza";byTitle(r,0);return;}net+=d;}
    byTitle(r,d);
    if(Math.abs(d)<0.5){el.className="res m";el.textContent="Nessuna modifica";}
    else if(d<0){
      const g=Math.max(0,(parseNum(X.gain&&X.gain[r.id]||"")||0)*RATE[X.cur||S.base]/RATE[S.base]),tx=rate&&r.c>0?-d*Math.min(1,g/r.c)*rate/100:0;taxT+=tx;
      el.className="res s";el.innerHTML="Vendi "+fmt(-d)+(rate?`<small>tasse stimate ${fmt(tx)}</small>`:"");
    }else{el.className="res b";el.textContent="Compra "+fmt(d);}
  });
  const m=$("rsum");m.style.color="var(--ink)";
  m.textContent=R.mode==="amt"?(Math.abs(net)<0.5?"Il totale del portafoglio resta invariato.":net>0?`Servono ${fmt(net)} di nuovi soldi da investire.`:`Liberi ${fmt(-net)}.`)
    :(Math.abs(sum-100)>0.05?`Le percentuali sommano ${sum.toFixed(1).replace(".",",")}%: devono fare 100%.`:(acq?(A>0?"Investirai "+fmt(A)+".":"Scrivi quanto vuoi investire."):""));
  $("rtax").textContent=rate&&taxT>0?"Tasse stimate sulle vendite: "+fmt(taxT)+".":"";
}

    await push();m.textContent="Importati "+ys.length+" anni.";
  });
}

const kfmt=v=>Math.abs(v)>=1e6?(v/1e6).toLocaleString("it-IT",{maximumFractionDigits:2})+" M":Math.abs(v)>=1e3?(v/1e3).toLocaleString("it-IT",{maximumFractionDigits:Math.abs(v)>=1e5?0:1})+" k":Math.round(v).toLocaleString("it-IT");
function chartSvg(P,big){
  const W=340,H=big?210:60,l=big?46:4,r=big?10:4,t=big?12:6,b=big?26:6,n=P.length;
  const vs=P.flatMap(p=>[p.e,p.u]);let lo=Math.min(...vs),hi=Math.max(...vs);
  if(hi-lo<1e-9){hi+=Math.abs(hi)*0.01||1;lo-=Math.abs(lo)*0.01||1;}          // una sola quota: evito la divisione per zero
  if(big){const pad=(hi-lo)*0.08;lo-=pad;hi+=pad;}
  const X=i=>n>1?l+i*(W-l-r)/(n-1):(W+l-r)/2,Y=v=>t+(hi-v)/(hi-lo)*(H-t-b);
  const line=(k,c)=>n>1?`<polyline class="ln ${c}" points="${P.map((p,i)=>X(i).toFixed(1)+","+Y(p[k]).toFixed(1)).join(" ")}"${big?"":' vector-effect="non-scaling-stroke"'}/>`
    :`<circle class="${c}d" cx="${X(0).toFixed(1)}" cy="${Y(P[0][k]).toFixed(1)}" r="4"/>`;
  let g="";
  if(big){g=[lo,(lo+hi)/2,hi].map(v=>`<line class="grid" x1="${l}" x2="${W-r}" y1="${Y(v).toFixed(1)}" y2="${Y(v).toFixed(1)}"/><text class="ax" x="${l-6}" y="${(Y(v)+3.5).toFixed(1)}" text-anchor="end">${kfmt(v)}</text>`).join("");
    g+=P.map((p,i)=>(n<=8||i%2===(n-1)%2)?`<text class="ax" x="${X(i).toFixed(1)}" y="${H-8}" text-anchor="middle">${MESI[p.m-1].slice(0,3)}</text>`:"").join("");}
  return `<svg class="${big?"chart":""}" viewBox="0 0 ${W} ${H}"${big?"":' preserveAspectRatio="none"'} xmlns="http://www.w3.org/2000/svg" role="img" aria-label="${L("Grafico del patrimonio","Net worth chart")}">${g}${line("u","ln2")}${line("e","ln1")}</svg>`;
}
